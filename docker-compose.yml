services:
    hledger-dockerized:
        image: dastapov/hledger
        environment:
            -   HLEDGER_JOURNAL_FILE=/data/all.journal
            # if behind reverse proxy, set base url
            # -   HLEDGER_BASE_URL=https://hledger.example.com
        ports:
            -   5000:5000
        restart: always
        # Replace with your own uid (run `id -u`), so that files written to /data are owned by you
        user: "1000"
        volumes:
            -   ${HOME}/journals:/data
